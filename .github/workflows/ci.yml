name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

# CI only needs to read the repository. Dependency updates are uploaded
# as reviewable artifacts and are never pushed back by the workflow.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install and test exactly the dependency graph committed in this PR.
      # Do not silently rewrite package-lock.json before npm ci.
      - name: Install committed dependencies
        run: npm ci

      - name: Audit committed dependency lockfile (non-blocking)
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            console.log(JSON.stringify(report.metadata?.vulnerabilities ?? report.error ?? {}, null, 2));
          } catch (error) {
            console.warn('npm audit output could not be parsed:', error.message);
          }
          NODE

      # Produce a reviewable candidate separately. The installed node_modules
      # and the committed lockfile used by CI tests remain unchanged.
      - name: Generate safe dependency remediation candidate
        run: |
          cp package-lock.json package-lock.original.json
          npm audit fix --package-lock-only --ignore-scripts || echo "Safe fixes applied where possible; remaining advisories will be reported separately."
          cp package-lock.json npm-security-remediation-candidate.json
          mv package-lock.original.json package-lock.json

      - name: Upload dependency remediation candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-remediation-candidate
          path: |
            npm-security-remediation-candidate.json
            npm-audit.json
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
