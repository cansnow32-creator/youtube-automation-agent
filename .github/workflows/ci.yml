name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci

      - name: Generate safe dependency remediation candidate
        run: |
          npm audit fix --package-lock-only --ignore-scripts || echo "Safe fixes applied where possible; remaining advisories will be reported separately."
          npm ci

      - name: Dependency audit report (non-blocking)
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            console.log(JSON.stringify(report.metadata?.vulnerabilities ?? report.error ?? {}, null, 2));
          } catch (error) {
            console.warn('npm audit output could not be parsed:', error.message);
          }
          NODE

      - name: Upload dependency remediation candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-remediation-candidate
          path: |
            package-lock.json
            npm-audit.json
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Commit regenerated dependency lockfile
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh dependency lockfile"
            git push
          fi
