name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate safe dependency remediation candidate
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm ci

      - name: Dependency audit report (non-blocking)
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            console.log(JSON.stringify(report.metadata?.vulnerabilities ?? report.error ?? {}, null, 2));
          } catch (error) {
            console.warn('npm audit output could not be parsed:', error.message);
          }
          NODE

      - name: Upload dependency remediation candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-remediation-candidate
          path: |
            package-lock.json
            npm-audit.json
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
