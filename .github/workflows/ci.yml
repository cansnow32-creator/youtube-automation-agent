name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit report (non-blocking)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report = require('./npm-audit.json'); console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));"

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
